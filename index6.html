<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محققو التسارع ⚡ | مهمة نيوتن الثانية</title><style>
:root{--bg:#0a1428;--ac:#29e0c2;--tx:#e6f1ff;--mu:#8fa6c8;--bad:#ff6b81;--gd:#ffd166;--pn:rgba(18,34,64,.92)}

.fb{margin-top:10px}.ok{color:var(--ac);border-right:4px solid var(--ac);padding:6px 12px;background:rgba(41,224,194,.08);animation:pop .4s}.no{color:var(--bad);border-right:4px solid var(--bad);padding:6px 12px;background:rgba(255,107,129,.08);animation:shk .4s}@keyframes pop{from{transform:scale(.96);opacity:0}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
input[type=number],select,textarea{background:#06101f;color:var(--tx);border:1px solid #2b4673;border-radius:8px;padding:8px;font:700 20px Consolas,monospace;width:110px;text-align:center}select,textarea{font-family:inherit;width:auto}textarea{width:100%;font-size:17px;text-align:right}input.bad{border-color:var(--bad)}input.good{border-color:var(--ac)}input:disabled{opacity:.8}
.trk{position:relative;height:90px;margin:8px 0;border-bottom:4px solid #2b4673;overflow:hidden;background:linear-gradient(#0b1830,#0a1428)}.cart{position:absolute;left:8px;bottom:0;height:70px;width:130px;will-change:transform}.cart .body{position:absolute;bottom:14px;left:0;right:0;top:10px;background:linear-gradient(#35e8cb,#17a892);border-radius:8px 8px 4px 4px;color:#04121f;font:700 15px Consolas,monospace;text-align:center;line-height:42px}.w{position:absolute;bottom:0;width:22px;height:22px;border-radius:50%;background:#e6f1ff;border:5px solid #1b2c4d}.w1{left:14px}.w2{right:14px}
.arw{position:absolute;left:100%;top:34px;height:6px;background:var(--gd);box-shadow:0 0 8px var(--gd);margin-left:2px}.arw:after{content:"";position:absolute;right:-12px;top:-7px;border:10px solid transparent;border-left:14px solid var(--gd);border-right:0}.arw span{position:absolute;top:-30px;right:0;color:var(--gd);font:700 14px Consolas,monospace;white-space:nowrap}
.sl{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin:8px 0}input[type=range]{width:100%;accent-color:var(--ac);height:30px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.row2{grid-template-columns:1fr}.sl{grid-template-columns:90px 1fr 70px}body{font-size:16px}}
table{border-collapse:collapse;width:100%;text-align:center;margin:8px 0;direction:rtl}th,td{border:1px solid #2b4673;padding:8px}th{background:#0d1b33;color:var(--ac)}td.fx{font:700 20px Consolas,monospace;color:var(--gd)}
.eq{display:flex;align-items:center;justify-content:center;gap:12px;font:700 28px Consolas,monospace;direction:ltr;flex-wrap:wrap;margin:14px 0}.slot{min-width:150px;min-height:64px;border:2px dashed var(--ac);border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 17px "Segoe UI",Tahoma;cursor:pointer;color:var(--ac);padding:4px 10px;text-align:center}.slot.f{border-style:solid;background:rgba(41,224,194,.15);color:var(--tx)}
.cds{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.cd{background:#0d1b33;border:2px solid var(--gd);color:var(--gd);border-radius:10px;padding:10px 18px;cursor:pointer;font:700 18px inherit;font-family:inherit}.cd.sel{background:var(--gd);color:#04121f}.cd:disabled{opacity:.25}
.lg{font:15px Consolas,monospace;direction:ltr;text-align:left;color:var(--mu)}.chk{color:var(--mu)}.chk.d{color:var(--ac)}
#modal{position:fixed;inset:0;background:rgba(2,8,20,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}#modal.on{display:flex}#modal .card{max-width:640px;max-height:85vh;overflow:auto;margin:0}
.ttl{font-size:26px;color:var(--gd);font-weight:700}ol.cl li,ul.cl li{margin:8px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><h1>⚡ محققو التسارع | مهمة نيوتن الثانية</h1><div class="hud"><small>النقاط</small><span class="lcd" id="pts">0</span><small>الصحيحة</small><span class="lcd" id="okc">0</span><button class="ib" id="tc">🎓 بطاقة المعلم</button><button class="ib" id="mu">🔊</button><button class="ib" id="rs">↻ إعادة</button></div></header>
<div id="bar"><i></i></div><div id="dots"></div><main id="m"></main>
<div id="modal"><div class="card"><h2>🎓 بطاقة المعلم</h2><div id="tcb"></div><button class="btn" id="tcx">إغلاق</button></div></div>
<script>
var S={pts:0,ok:0,st:-1},muted=false,AC=null,raf=0;
var NAMES=['توقّع','مختبر القوة','اكتشف العلاقة','ابنِ القانون','تحدّي نيوتن'];
var $=function(s){return document.querySelector(s)},M=$('#m');
function fmt(n){return String(+n.toFixed(2))}
function beep(g){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain();o.connect(v);v.connect(AC.destination);o.type='sine';var t=AC.currentTime;if(g){o.frequency.setValueAtTime(520,t);o.frequency.setValueAtTime(780,t+.1)}else{o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(160,t+.12)}v.gain.setValueAtTime(.12,t);v.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function hud(){$('#pts').textContent=S.pts;$('#okc').textContent=S.ok;$('#bar i').style.width=(Math.max(S.st,0)/5*100)+'%';$('#dots').innerHTML=NAMES.map(function(n,i){return '<span class="'+(i==S.st?'on':i<S.st?'dn':'')+'">'+(i+1)+'. '+n+'</span>'}).join('')}
$('#mu').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
$('#rs').onclick=function(){S={pts:0,ok:0,st:-1};go(-1)};
var TEACH=['<b>المرحلة 1:</b> الإجابة (ب): العربة الأصغر كتلة تتسارع أكثر (6 m/s² مقابل 2 m/s²).','<b>المرحلة 2:</b> مضاعفة القوة مع ثبات الكتلة تضاعف التسارع؛ مضاعفة الكتلة مع ثبات القوة تُنصّف التسارع.','<b>المرحلة 3:</b> الجدول 1: 12، 6، 4، 3، 2 | الجدول 2: 1، 2، 3، 4، 5. العلاقة مع القوة طردية، ومع الكتلة عكسية.','<b>المرحلة 4:</b> ΣF = m × a ، الوحدات: N و kg و m/s² ، و1 N = 1 kg·m/s².','<b>المرحلة 5:</b> الإجابات: 1) يتضاعف 2) 2.5 m/s² 3) عكسية 4) 12 N 5) 4 m/s² 6) 3 kg 7) زيادة القوة المحصلة 8) B أكبر كتلة.','<b>الأهداف:</b> يستنتج الطالب العلاقة الطردية بين التسارع والقوة المحصلة، والعكسية بين التسارع والكتلة، ويستخدم ΣF = ma بوحدات SI، ويميّز التسارع من السرعة. 10 نقاط لكل استنتاج صحيح من المحاولة الأولى.'];
$('#tc').onclick=function(){$('#tcb').innerHTML=TEACH.map(function(x){return '<p>'+x+'</p>'}).join('');$('#modal').classList.add('on')};$('#tcx').onclick=function(){$('#modal').classList.remove('on')};
function go(n){cancelAnimationFrame(raf);S.st=n;hud();window.scrollTo(0,0);R[n+1]()}
function ask(box,q,done){var tries=0,fin=false;
 box.innerHTML='<div class="card"><h3>'+q.t+'</h3>'+(q.num?'<input type="number" step="any" inputmode="decimal"> <b class="mu">'+q.num.u+'</b> <button class="btn go">تحقّق</button>':'<div class="opts">'+q.o.map(function(x,i){return '<button class="opt" data-i="'+i+'">'+x+'</button>'}).join('')+'</div>')+'<div class="fb"></div><div class="act"></div></div>';
 var fb=box.querySelector('.fb'),act=box.querySelector('.act'),inp=box.querySelector('input'),bs=box.querySelectorAll('.opt');
 function lock(v){bs.forEach(function(b){if(!b.classList.contains('bad'))b.disabled=v});if(inp)inp.disabled=v}
 function res(ok,b){if(fin)return;if(ok){fin=true;lock(true);if(b)b.classList.add('good');if(inp)inp.classList.add('good');var p=tries==0;if(p){S.pts+=10;S.ok++}hud();beep(1);fb.innerHTML='<div class="ok">✔ '+(p?'<b>+10 نقاط</b> — ':'صحيح — ')+q.e+'</div>';act.innerHTML='<button class="btn nx">'+(q.nx||'السؤال التالي')+' ◀</button>';act.firstChild.onclick=done}
 else{tries++;lock(true);beep(0);if(b)b.classList.add('bad');if(inp)inp.classList.add('bad');fb.innerHTML='<div class="no">✖ ليست صحيحة. تلميح: '+q.h+'</div>';act.innerHTML='<button class="btn g">جرّب مرة أخرى</button>';act.firstChild.onclick=function(){fb.innerHTML='';act.innerHTML='';if(inp){inp.value='';inp.classList.remove('bad')}lock(false);if(inp)inp.focus()}}}
 bs.forEach(function(b){b.onclick=function(){res(+b.dataset.i===q.a,b)}});
 if(inp){box.querySelector('.go').onclick=function(){if(inp.value==='')return;res(Math.abs(+inp.value-q.num.a)<1e-6)};inp.onkeydown=function(e){if(e.key==='Enter')box.querySelector('.go').click()}}}
function cart(id,m,F){return '<div class="trk" dir="ltr"><div class="cart" id="'+id+'" style="width:'+(70+m*9)+'px"><div class="arw" style="width:'+(F*7)+'px"><span>ΣF = '+F+' N</span></div><div class="body">'+m+' kg</div><i class="w w1"></i><i class="w w2"></i></div></div>'}
function sim(items,loop,T){var t0=performance.now();cancelAnimationFrame(raf);(function f(now){var t=(now-t0)/1000;items.forEach(function(it){var el=document.getElementById(it.id);if(!el)return;var lim=el.parentNode.clientWidth-el.offsetWidth-(it.arw||90),x=Math.min(.5*it.a()*t*t*28,lim);el.style.transform='translateX('+x+'px)'});if(t>T){if(!loop)return;t0=now}raf=requestAnimationFrame(f)})(t0)}
var R=[];
R[0]=function(){M.innerHTML='<div class="card"><h2>مرحباً أيها المحقق!</h2><p class="big">مهمتك اكتشاف القانون الذي يربط <b>القوة المحصلة</b> و<b>الكتلة</b> و<b>التسارع</b>، بالتوقع ثم التجربة ثم الاستنتاج.</p><p class="mu">كل استنتاج صحيح من المحاولة الأولى يمنحك 10 نقاط. التلميحات تساعدك عند الخطأ، ويمكنك المحاولة مجدداً.</p><button class="btn" id="go">ابدأ المهمة ◀</button></div>';$('#go').onclick=function(){go(0)}};
R[1]=function(){M.innerHTML='<div class="card"><h2>المرحلة 1: توقّع يا محقق</h2><p>عربتان على سطح أملس، تؤثر في كل منهما <b>القوة المحصلة نفسها 12 N</b>:</p>'+cart('c1',2,12)+cart('c2',6,12)+'<p class="mu">العلوية كتلتها 2 kg، والسفلية 6 kg.</p></div><div id="q"></div><div id="after"></div>';
 ask($('#q'),{t:'أي العبارتين صحيحة؟',o:['أ. العربة ذات الكتلة الأكبر تتسارع أكثر.','ب. العربة ذات الكتلة الأصغر تتسارع أكثر.','ج. يتساوى تسارع العربتين.'],a:1,h:'تخيّل دفع عربة تسوق فارغة وأخرى ممتلئة بالقوة نفسها: أيهما أسهل في تغيير حركتها؟',e:'عند ثبوت القوة المحصلة يقلّ التسارع كلما زادت الكتلة، فالأصغر كتلة أكثر تسارعاً.',nx:'المرحلة التالية'},function(){go(1)});
 var q=$('#q');new MutationObserver(function(){if(q.querySelector('.ok')&&!$('#after').innerHTML){$('#after').innerHTML='<div class="card"><button class="btn g" id="run">▶ شغّل التجربة للتحقق</button><span id="rd" class="lg"></span><p class="mu">الحركة المعروضة تمثيل مبسط للتسارع.</p></div>';$('#run').onclick=function(){$('#rd').textContent=' a₁ = 6 m/s² , a₂ = 2 m/s²';sim([{id:'c1',a:function(){return 6}},{id:'c2',a:function(){return 2}}],false,4)}}}).observe(q,{childList:true,subtree:true})};
R[2]=function(){var F=4,m=2,log=[],ti=0;
 var TS=[{need:[[4,2],[8,2]],tx:'<b>التجربة 1 — ثبّت الكتلة على 2 kg:</b> سجّل قراءة عند F = 4 N ثم أخرى عند F = 8 N.',q:{t:'ضاعفنا القوة المحصلة (4→8 N) والكتلة ثابتة. ماذا حدث للتسارع؟',o:['تضاعف','أصبح النصف','لم يتغير'],a:0,h:'قارن قراءتي a في سجلّك: كم مرة زادت؟',e:'عند ثبوت الكتلة، تتناسب القوة المحصلة طردياً مع التسارع.',nx:'التجربة التالية'}},{need:[[8,2],[8,4]],tx:'<b>التجربة 2 — ثبّت القوة على 8 N:</b> سجّل قراءة عند m = 2 kg ثم أخرى عند m = 4 kg.',q:{t:'ضاعفنا الكتلة (2→4 kg) والقوة المحصلة ثابتة. ماذا حدث للتسارع؟',o:['تضاعف','أصبح النصف','لم يتغير'],a:1,h:'انظر إلى القراءتين في السجل: هل زاد التسارع أم قلّ؟ وبكم مرة؟',e:'عند ثبوت القوة المحصلة، يتناسب التسارع عكسياً مع الكتلة.',nx:'المرحلة التالية'}}];
 M.innerHTML='<div class="card"><h2>المرحلة 2: مختبر القوة</h2><div id="tk"></div>'+cart('lc',m,F)+'<div class="sl"><b>القوة ΣF</b><input type="range" id="fs" min="2" max="20" step="2"><span class="lcd" id="fv"></span></div><div class="sl"><b>الكتلة m</b><input type="range" id="ms" min="1" max="10" step="1"><span class="lcd" id="mv"></span></div><div>التسارع a = <span class="lcd" id="av"></span> m/s² <button class="btn" id="rec">📝 سجّل القراءة</button></div><p class="mu">الحركة المعروضة تمثيل مبسط يتناسب مع قيمة التسارع.</p><div id="lg" class="lg"></div><div id="ck"></div></div><div id="q"></div>';
 function upd(){F=+$('#fs').value;m=+$('#ms').value;$('#fv').textContent=F+' N';$('#mv').textContent=m+' kg';$('#av').textContent=fmt(F/m);var c=$('#lc');c.style.width=(70+m*9)+'px';c.firstChild.style.width=(F*7)+'px';c.firstChild.firstChild.textContent='ΣF = '+F+' N';c.lastChild.previousSibling.previousSibling.textContent=m+' kg';sim([{id:'lc',a:function(){return F/m},arw:F*7+30}],true,4)}
 function tsk(){var T=TS[ti];log=[];F=T.need[0][0];m=T.need[0][1];$('#fs').value=F;$('#ms').value=m;$('#tk').innerHTML='<p class="big">'+T.tx+'</p>';$('#q').innerHTML='';lg();upd()}
 function lg(){var T=TS[ti];$('#lg').innerHTML=log.map(function(r){return 'ΣF='+r[0]+' N , m='+r[1]+' kg , a='+fmt(r[0]/r[1])+' m/s²'}).join('<br>');$('#ck').innerHTML=T.need.map(function(n){var d=log.some(function(r){return r[0]==n[0]&&r[1]==n[1]});return '<div class="chk '+(d?'d':'')+'">'+(d?'☑':'☐')+' F = '+n[0]+' N , m = '+n[1]+' kg</div>'}).join('');return T.need.every(function(n){return log.some(function(r){return r[0]==n[0]&&r[1]==n[1]})})}
 $('#fs').oninput=upd;$('#ms').oninput=upd;
 $('#rec').onclick=function(){if(!log.some(function(r){return r[0]==F&&r[1]==m}))log.push([F,m]);if(lg()&&!$('#q').innerHTML){beep(1);ask($('#q'),TS[ti].q,function(){if(ti<1){ti++;tsk()}else go(2)})}};
 tsk()};
R[3]=function(){var T1=[[1,12,0],[2,6,1],[3,4,0],[4,3,0],[6,2,0]],T2=[[2,1,1],[4,2,0],[6,3,0],[8,4,0],[10,5,0]];
 function tb(id,hd,rows,k){return '<table id="'+id+'"><tr><th>'+hd[0]+'</th><th>'+hd[1]+'</th><th>التسارع a (m/s²)</th></tr>'+rows.map(function(r,i){return '<tr><td class="fx">'+r[0]+'</td><td class="fx">'+k+'</td><td>'+(r[2]?'<b class="fx">'+r[1]+'</b>':'<input type="number" step="any" data-a="'+r[1]+'">')+'</td></tr>'}).join('')+'</table>'}
