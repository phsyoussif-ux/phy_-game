<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIG-FIG CONTROL ROOM | غرفة التحكم بالأرقام المعنوية</title>
<style>
:root{
  --bg-deep:#080b10;
  --bg-panel:#111826;
  --bg-panel-2:#182233;
  --line:#25313f;
  --text:#edf2f6;
  --text-dim:#8494a6;
  --blue:#4da3ff;
  --blue-dim:#1c3a57;
  --orange:#ff9d4d;
  --orange-dim:#5a3a1c;
  --good:#3ddc97;
  --bad:#ff5c72;
  --gold:#f2c94c;
  --radius:4px;
  --font-ar:'Segoe UI','Tahoma','Noto Sans Arabic',Arial,sans-serif;
  --font-num:'Consolas','SFMono-Regular','Courier New',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-ar);
  background:
    radial-gradient(1000px 600px at 85% -10%, rgba(77,163,255,.06), transparent 60%),
    radial-gradient(900px 600px at 5% 105%, rgba(255,157,77,.05), transparent 60%),
    repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 44px),
    var(--bg-deep);
  color:var(--text);
  min-height:100vh;
  direction:rtl;
  padding-bottom:92px;
}
.app{max-width:1100px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

/* ===== topbar ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:12px 20px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(17,24,38,.92), rgba(17,24,38,.5));
  backdrop-filter:blur(4px); position:sticky; top:0; z-index:50; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:26px;height:26px;border:2px solid var(--blue); position:relative; flex:none; transform:rotate(45deg);}
.brand-mark::after{content:"";position:absolute;inset:5px;border:1px solid var(--orange);}
.brand-text{font-size:13px; color:var(--text-dim);}
.brand-text b{color:var(--text); font-weight:700;}
.stage-pill{
  font-family:var(--font-num); font-size:11px; letter-spacing:1px; color:var(--blue);
  border:1px solid var(--blue-dim); padding:4px 10px; border-radius:20px; background:rgba(77,163,255,.08);
}
.top-right{display:flex; align-items:center; gap:14px;}
.clock{font-family:var(--font-num); font-size:16px; color:var(--gold); min-width:52px; text-align:center; display:none;}
.clock.on{display:inline-block;}
.score-mini{display:none; gap:10px; font-family:var(--font-num); font-size:13px;}
.score-mini.on{display:flex;}
.score-mini span.a{color:var(--blue);}
.score-mini span.b{color:var(--orange);}

.progress-track{height:3px; background:var(--line);}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--blue),var(--orange)); width:0%; transition:width .35s;}

/* ===== stage area ===== */
main{flex:1; display:flex; flex-direction:column; padding:30px 20px 20px; align-items:center;}
.stage-wrap{max-width:760px; width:100%;}
.card{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:26px;
  animation:fadeIn .35s ease;
}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-family:var(--font-num); font-size:11px; letter-spacing:1.5px; color:var(--text-dim); margin-bottom:10px;}
.eyebrow b{color:var(--orange);}
h2.title{font-size:20px; margin-bottom:14px; line-height:1.6;}
p.lead{font-size:15px; line-height:1.9; color:var(--text-dim); margin-bottom:16px;}

/* readouts for numbers */
.numbers-block{background:#05080c; border:1px solid var(--line); border-radius:var(--radius); padding:26px 18px; text-align:center; margin-bottom:18px; position:relative; overflow:hidden;}
.numbers-block .expr{font-family:var(--font-num); direction:ltr; font-size:clamp(22px,5vw,36px); font-weight:700; letter-spacing:1px;}
.numbers-block .expr .op{color:var(--text-dim); margin:0 10px;}
.numbers-block .expr .num{position:relative; display:inline-block;}
.numbers-block .expr .num .hi{border-bottom:2px solid var(--blue); color:var(--blue);}
.numbers-block .expr .num .hi.mul{border-bottom-color:var(--orange); color:var(--orange);}
.numbers-block .sub{margin-top:10px; font-size:12px; color:var(--text-dim); font-family:var(--font-num);}
.stack-nums{display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--font-num); direction:ltr;}
.stack-nums .row{font-size:clamp(26px,5.5vw,42px); font-weight:700;}
.stack-nums .op-row{width:100%; display:flex; justify-content:flex-start; font-size:22px; color:var(--text-dim); max-width:220px;}
.stack-nums .line{width:100%; max-width:240px; border-top:2px solid var(--text-dim); margin:4px 0;}

/* option grids */
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.opts.single{grid-template-columns:1fr;}
.opt{
  font-family:var(--font-ar); text-align:right; background:var(--bg-panel-2); border:1px solid var(--line);
  color:var(--text); padding:14px 16px; border-radius:var(--radius); font-size:14.5px; line-height:1.7; cursor:default;
  transition:.15s;
}
.opt .k{font-family:var(--font-num); color:var(--blue); margin-left:8px;}
.opt.correct{border-color:var(--good); background:rgba(61,220,151,.1); color:var(--good);}
.opt.wrong-hint{opacity:.5;}

.numpad{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:6px;}
.numpad .n{
  font-family:var(--font-num); font-size:20px; font-weight:700; width:58px;height:58px;border-radius:50%;
  background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text); display:flex;align-items:center;justify-content:center;
}
.numpad .n.correct{border-color:var(--good); background:rgba(61,220,151,.15); color:var(--good);}

.explain-box{
  margin-top:16px; padding:14px 16px; border-radius:var(--radius); font-size:13.5px; line-height:1.85;
  border:1px solid var(--line); background:rgba(77,163,255,.05); display:none;
}
.explain-box.show{display:block;}
.explain-box b{color:var(--blue);}

/* steps slide */
.steps-ladder{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
.step-row{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:var(--bg-panel-2); opacity:.3; transition:.3s;}
.step-row.active{opacity:1; border-color:var(--blue);}
.step-row.active.mul{border-color:var(--orange);}
.step-row .stitle{font-family:var(--font-num); font-size:11px; color:var(--text-dim); letter-spacing:1px; margin-bottom:6px;}
.step-row .sval{font-size:16px; font-family:var(--font-num); direction:ltr;}
.gate-row{display:flex; gap:12px; justify-content:center; margin:10px 0 16px;}
.gate-btn{
  flex:1; max-width:200px; padding:16px; border-radius:var(--radius); border:1px solid var(--line);
  background:var(--bg-panel-2); color:var(--text); font-family:var(--font-ar); font-weight:700; cursor:pointer; transition:.15s;
}
.gate-btn:hover{border-color:var(--blue);}
.gate-btn.chosen-correct{border-color:var(--good); background:rgba(61,220,151,.12); color:var(--good);}
.gate-btn.chosen-wrong{border-color:var(--bad); background:rgba(255,92,114,.1); color:var(--bad);}
.analyze-btn{
  font-family:var(--font-ar); font-size:12.5px; background:transparent; border:1px dashed var(--text-dim); color:var(--text-dim);
  padding:7px 14px; border-radius:20px; cursor:pointer; margin-bottom:10px; transition:.15s;
}
.analyze-btn.on{border-color:var(--gold); color:var(--gold);}
.analyze-hi{background:rgba(242,201,76,.18); border-radius:2px; padding:0 1px;}

/* rule card */
.rule-card{border-radius:var(--radius); padding:24px; text-align:center; border:1px solid var(--line);}
.rule-card.addsub{background:linear-gradient(160deg, rgba(77,163,255,.12), transparent); border-color:var(--blue-dim);}
.rule-card.muldiv{background:linear-gradient(160deg, rgba(255,157,77,.12), transparent); border-color:var(--orange-dim);}
.rule-card .tag{font-size:22px; font-weight:700; margin-bottom:8px;}
.rule-card.addsub .tag{color:var(--blue);}
.rule-card.muldiv .tag{color:var(--orange);}
.rule-card .body{font-size:14.5px; line-height:1.9; color:var(--text); max-width:520px; margin:10px auto 0;}
.rule-card .hook{margin-top:16px; font-size:20px; font-weight:700; font-family:var(--font-num);}
.rule-card.addsub .hook{color:var(--blue);}
.rule-card.muldiv .hook{color:var(--orange);}

/* comparison */
.compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.compare-box{border-radius:var(--radius); padding:20px; text-align:center; border:1px solid var(--line);}
.compare-box.blue{background:rgba(77,163,255,.08); border-color:var(--blue-dim);}
.compare-box.orange{background:rgba(255,157,77,.08); border-color:var(--orange-dim);}
.compare-box .h{font-size:17px; font-weight:700; margin-bottom:6px;}
.compare-box.blue .h{color:var(--blue);}
.compare-box.orange .h{color:var(--orange);}
.compare-box .op{font-size:13px; color:var(--text-dim); margin-bottom:10px;}
.compare-box .rule{font-size:14px; line-height:1.8;}
@media(max-width:640px){.compare-grid{grid-template-columns:1fr;}}

/* match */
.match-wrap{display:flex; gap:20px; flex-wrap:wrap; justify-content:space-between;}
.match-col{flex:1; min-width:220px; display:flex; flex-direction:column; gap:9px;}
.match-col h4{font-size:11px; color:var(--text-dim); letter-spacing:1px;}
.match-card{font-family:var(--font-num); direction:ltr; text-align:center; padding:13px; border-radius:var(--radius); background:var(--bg-panel-2); border:1px solid var(--line); cursor:pointer; font-size:15px; transition:.12s;}
.match-card.label{font-family:var(--font-ar); direction:rtl; font-size:13.5px;}
.match-card.selected{border-color:var(--gold); color:var(--gold);}
.match-card.locked{border-color:var(--good); background:rgba(61,220,151,.1); color:var(--good); pointer-events:none;}
.match-card.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

/* confidence */
.conf-row{display:flex; gap:10px; justify-content:center; margin:14px 0;}
.conf-btn{font-family:var(--font-num); font-size:15px; font-weight:700; padding:12px 16px; border-radius:var(--radius); background:var(--bg-panel-2); border:1px solid var(--line); color:var(--gold); cursor:pointer;}
.conf-btn.chosen{border-color:var(--gold); background:rgba(242,201,76,.15);}

/* boss */
.boss-q{border-right:2px solid var(--line); padding-right:14px; margin-bottom:14px; opacity:.3; transition:.3s;}
.boss-q.active{opacity:1; border-color:var(--gold);}
.boss-q .qn{font-size:13px; color:var(--text-dim); margin-bottom:4px;}
.boss-q .qa{font-size:15px; font-weight:700; color:var(--gold); margin-top:4px; display:none;}
.boss-q .qa.show{display:block;}

/* final lock */
.mini-examples{display:flex; gap:16px; justify-content:center; margin:16px 0; flex-wrap:wrap; font-family:var(--font-num); direction:ltr; font-size:15px;}
.mini-examples span{color:var(--text-dim);}
.mini-examples b{color:var(--good);}
.rhet{text-align:center; font-size:15px; line-height:2.1; margin:10px 0;}
.rhet .no{color:var(--bad);}
.rhet .yes{color:var(--good);}
.lock-btn{display:block; margin:20px auto 6px; padding:16px 30px; border-radius:var(--radius); background:linear-gradient(90deg,var(--blue),var(--orange)); border:none; color:#0a0e14; font-weight:700; font-size:15px; cursor:pointer;}
.lock-confirm{text-align:center; margin-top:14px; font-size:15px; color:var(--good); display:none; font-weight:700;}
.lock-confirm.show{display:block;}

/* trap */
.trap-badge{display:inline-block; background:rgba(255,92,114,.12); border:1px solid var(--bad); color:var(--bad); font-size:11px; padding:4px 10px; border-radius:20px; margin-bottom:12px; font-family:var(--font-num); letter-spacing:1px;}

/* dock */
.dock{
  position:fixed; bottom:0; left:0; right:0; z-index:60;
  background:linear-gradient(0deg, rgba(8,11,16,.98), rgba(8,11,16,.9));
  border-top:1px solid var(--line); padding:10px 16px; backdrop-filter:blur(6px);
}
.dock-inner{max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;}
.dbtn{
  font-family:var(--font-ar); font-size:13px; font-weight:700; padding:10px 16px; border-radius:var(--radius);
  background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text); cursor:pointer; transition:.15s;
}
.dbtn:hover{border-color:var(--blue);}
.dbtn.next{background:linear-gradient(90deg,var(--blue),#2f7fd6); color:#06121f; border:none;}
.dbtn:disabled{opacity:.3; cursor:not-allowed;}
.dbtn.small{font-size:11.5px; padding:8px 12px; color:var(--text-dim);}

/* overlay */
.overlay{position:fixed; inset:0; background:rgba(4,6,10,.7); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
.overlay.show{display:flex;}
.overlay-card{max-width:480px; width:100%;}
.overlay-close{display:block; margin:16px auto 0; }

/* scoreboard */
.scoreboard-bar{display:none; gap:14px; padding:10px 20px; justify-content:center;}
.scoreboard-bar.on{display:flex;}
.team-chip{display:flex; align-items:center; gap:10px; background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:8px 14px;}
.team-chip.a{border-color:var(--blue-dim);}
.team-chip.b{border-color:var(--orange-dim);}
.team-chip .tname{font-size:12px; color:var(--text-dim);}
.team-chip .tscore{font-family:var(--font-num); font-size:18px; font-weight:700;}
.team-chip.a .tscore{color:var(--blue);}
.team-chip.b .tscore{color:var(--orange);}
.team-chip button{width:24px;height:24px;border-radius:50%; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--text); cursor:pointer; font-size:13px;}

.flash-msg{position:fixed; top:70px; left:50%; transform:translateX(-50%); background:var(--bad); color:#1a0508; padding:8px 18px; border-radius:20px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:.25s; z-index:120;}
.flash-msg.show{opacity:1;}

/* start overlay */
.start-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px; min-height:80vh; padding:20px;}
.start-screen h1{font-size:clamp(28px,6vw,44px); font-weight:900; letter-spacing:1px;}
.start-screen h1 span{color:var(--orange);}
.start-screen .op-line{color:var(--text-dim); font-size:15px; max-width:480px; line-height:1.9;}
.start-screen .quote{font-size:16px; color:var(--text); max-width:460px; line-height:2; margin-top:6px;}

@media(max-width:640px){ .opts{grid-template-columns:1fr;} .card{padding:18px;} }
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div class="app">

  <div class="topbar" id="topbar" style="display:none;">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text"><b>SIG-FIG CONTROL ROOM</b></div>
    </div>
    <div class="stage-pill" id="stage-pill">STAGE 1 · QUICK SCAN</div>
    <div class="top-right">
      <div class="score-mini" id="score-mini"><span class="a">A: <b id="mini-a">0</b></span><span class="b">B: <b id="mini-b">0</b></span></div>
      <div class="clock" id="clock">10:00</div>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="scoreboard-bar" id="scoreboard-bar">
    <div class="team-chip a"><span class="tname">TEAM A</span><span class="tscore" id="team-a-score">0</span><button onclick="adjTeam('a',-1)">−</button><button onclick="adjTeam('a',1)">+</button></div>
    <div class="team-chip b"><span class="tname">TEAM B</span><span class="tscore" id="team-b-score">0</span><button onclick="adjTeam('b',-1)">−</button><button onclick="adjTeam('b',1)">+</button></div>
  </div>

  <main>
    <div class="stage-wrap" id="start-wrap">
      <div class="start-screen">
        <div class="brand-mark" style="width:40px;height:40px;"></div>
        <h1>⚡ SIG-FIG <span>CONTROL ROOM</span></h1>
        <div class="op-line">غرفة التحكم بالأرقام المعنوية — فيزياء الصف التاسع</div>
        <div class="quote">"الأرقام المعنوية ليست مجرد أرقام… إنها تخبرنا إلى أي درجة نثق في القياس."</div>
        <button class="dbtn next" style="padding:16px 32px; font-size:15px;" onclick="beginDeck()">بدء الحصة</button>
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button class="dbtn small" onclick="toggleTeamMode()">وضع الفريقين</button>
        </div>
      </div>
    </div>
    <div class="stage-wrap" id="slide-container" style="display:none;"></div>
  </main>

  <div class="dock" id="dock" style="display:none;">
    <div class="dock-inner">
      <button class="dbtn next" id="btn-next" onclick="doNext()">التالي</button>
      <button class="dbtn" id="btn-reveal" onclick="doReveal()">إظهار الإجابة</button>
      <button class="dbtn" id="btn-rule" onclick="showRuleOverlay()">إظهار القاعدة</button>
      <button class="dbtn" id="btn-explain" onclick="showExplainOverlay()">إظهار الشرح</button>
      <button class="dbtn small" onclick="toggleTimer()">المؤقت</button>
      <button class="dbtn small" onclick="toggleTeamMode()">الفريقان</button>
      <button class="dbtn small" onclick="resetDeck()">إعادة ضبط</button>
    </div>
  </div>
</div>

<div class="flash-msg" id="flash"></div>

<div class="overlay" id="overlay">
  <div class="overlay-card card" id="overlay-body"></div>
</div>
<script>
(function(){
document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) closeOverlay(); });
})();
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function flash(msg){
  const f = document.getElementById('flash'); f.textContent = msg;
  f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'), 1400);
}

/* =========================================================
   MATH HELPERS
========================================================= */
function decPlaces(str){ const i = str.indexOf('.'); return i<0?0:(str.length-i-1); }
function sigFigsOf(str){
  const s = str.replace('-','');
  if(s.indexOf('.')>=0){
    const digits = s.split('').filter(c=>c!=='.');
    let i=0; while(i<digits.length && digits[i]==='0') i++;
    return Math.max(1, digits.length - i);
  } else {
    const trimmed = s.replace(/0+$/,'');
    return Math.max(1, trimmed.length);
  }
}
function roundHalfUp(num, decimals){
  const factor = Math.pow(10, decimals);
  const eps = (num>=0?1:-1)*1e-9;
  return Math.round(num*factor + eps)/factor;
}
const SUP_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function toSup(n){ return String(n).split('').map(c=>SUP_DIGITS[c]||c).join(''); }
function formatMulDivAnswer(raw, sig){
  if(raw===0) return (0).toFixed(Math.max(0,sig-1));
  const neg = raw<0;
  let num = Math.abs(raw);
  let exp = Math.floor(Math.log10(num)+1e-9);
  let mant = roundHalfUp(num/Math.pow(10,exp), sig-1);
  if(mant>=10){ mant/=10; exp+=1; }
  const integerDigits = exp+1;
  if(exp>=0 && integerDigits>sig){
    // plain notation would need ambiguous trailing zeros -> use scientific notation
    return (neg?'-':'') + mant.toFixed(sig-1) + ' × 10' + toSup(exp);
  }
  const value = mant*Math.pow(10,exp);
  const decimals = Math.max(0, sig-1-exp);
  return (neg?'-':'') + value.toFixed(decimals);
}
function randDecimal(min,max,decimals){ const v = Math.random()*(max-min)+min; return Number(v.toFixed(decimals)); }
function computeAddSub(aStr,bStr,op){
  const a = parseFloat(aStr), b = parseFloat(bStr);
  const dpA = decPlaces(aStr), dpB = decPlaces(bStr);
  const minDp = Math.min(dpA,dpB);
  const raw = op==='+' ? (a+b) : (a-b);
  const rawDisplay = raw.toFixed(Math.max(dpA,dpB,2));
  const answer = roundHalfUp(raw, minDp).toFixed(minDp);
  return {dpA,dpB,minDp,raw,rawDisplay,answer};
}
function computeMulDiv(aStr,bStr,op){
  const a = parseFloat(aStr), b = parseFloat(bStr);
  const sigA = sigFigsOf(aStr), sigB = sigFigsOf(bStr);
  const minSig = Math.min(sigA,sigB);
  const raw = op==='×' ? (a*b) : (a/b);
  const rawDisplay = raw.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');
  const answer = formatMulDivAnswer(raw, minSig);
  return {sigA,sigB,minSig,raw,rawDisplay,answer};
}
function genAddSubProblem(){
  const dpA = 1+Math.floor(Math.random()*3), dpB = 1+Math.floor(Math.random()*3);
  const a = randDecimal(2,95,dpA), b = randDecimal(1,50,dpB);
  const op = Math.random()<0.5?'+':'-';
  return {aStr:a.toFixed(dpA), bStr:b.toFixed(dpB), op};
}

/* =========================================================
   SLIDE FACTORIES
========================================================= */
function slideMCQ(stage, eyebrow, title, opts, correctIdx, explain, ruleType){
  return {stage, kind:'mcq', step:0, maxStep:1, data:{eyebrow,title,opts,correctIdx,explain,ruleType}};
}
function slideNumpad(stage, eyebrow, item, ruleType){
  return {stage, kind:'numpad', step:0, maxStep:1, data:{eyebrow, v:item.v, u:item.u||'', n:item.n, explain:item.ex, ruleType}};
}
function slideMatch(stage, eyebrow, base, left, right, explain){
  return {stage, kind:'match', step:0, maxStep:left.length, matched:0, data:{eyebrow, base, left, right, explain}};
}
function slideDemo(stage, eyebrow, title, aStr, bStr, op, ruleType, opts){
  opts = opts||{};
  const calc = ruleType==='addsub'? computeAddSub(aStr,bStr,op) : computeMulDiv(aStr,bStr,op);
  return {stage, kind:'demo', step:0, maxStep:1, data:{eyebrow,title,aStr,bStr,op,ruleType,calc,suffix:opts.suffix||''}};
}
function slideSteps(stage, eyebrow, aStr, bStr, op, ruleType, gateFirst, suffix){
  const calc = ruleType==='addsub'? computeAddSub(aStr,bStr,op) : computeMulDiv(aStr,bStr,op);
  return {stage, kind:'steps', step:0, maxStep:3, gateResolved:!gateFirst, analyzeOn:false, data:{eyebrow,aStr,bStr,op,ruleType,calc,gateFirst,suffix:suffix||''}};
}
function slideRuleCard(stage, rule){
  return {stage, kind:'rulecard', step:0, maxStep:0, data:{rule}};
}
function slideComparison(stage, title){
  return {stage, kind:'comparison', step:0, maxStep:0, data:{title}};
}
function slideInfo(stage, eyebrow, title, body){
  return {stage, kind:'info', step:0, maxStep:0, data:{eyebrow,title,body}};
}
function slideTrap(stage, item){
  return {stage, kind:'trap', step:0, maxStep:1, data:{calc:item.calc, context:item.context, opts:TRAP_OPTS, correct:TRAP_CORRECT, explain:TRAP_EX}};
}
function slideChallenge(stage, eyebrow, title, aStr, bStr, op, ruleType, note, withConfidence, suffix){
  const calc = ruleType==='addsub'? computeAddSub(aStr,bStr,op) : computeMulDiv(aStr,bStr,op);
  return {stage, kind:'challenge', step:0, maxStep:1, confidence:null, data:{eyebrow,title,aStr,bStr,op,ruleType,calc,note,withConfidence,suffix:suffix||''}};
}
function slideBoss(){
  const p1 = computeAddSub("12.35","2.1","+"); // 14.45 -> 1dp -> 14.5
  const sub=[
    {q:"ما العملية الأولى التي يجب حسابها؟", a:"الجمع داخل الأقواس: 12.35 + 2.1"},
    {q:"ما القاعدة التي تُطبَّق على هذه الخطوة؟", a:"قاعدة الجمع والطرح — الفاصلة تحكم"},
    {q:"ما ناتج الجمع بعد التقريب؟", a:`${p1.raw.toFixed(2)} ← تُقرَّب إلى منزلة عشرية واحدة = ${p1.answer}`},
    {q:"ما العملية التالية والقاعدة المناسبة لها؟", a:"الضرب: " + p1.answer + " × 3.2 — قاعدة الضرب والقسمة (الأرقام تحكم)"},
    {q:"ما الناتج النهائي بعد تطبيق قاعدة الأرقام المعنوية؟", a:(function(){ const p2=computeMulDiv(p1.answer,"3.2","×"); return `${p2.raw.toFixed(3)} ← أقل عدد أرقام معنوية = ${p2.minSig} → الناتج النهائي = ${p2.answer}`; })()}
  ];
  return {stage:4, kind:'boss', step:0, maxStep:5, data:{sub}};
}
function slideFinalLock(){
  return {stage:4, kind:'finallock', step:0, maxStep:0, data:{}};
}

  return ['','STAGE 1 · QUICK SCAN','STAGE 2 · THE RULE','STAGE 3 · LIVE CALCULATIONS','STAGE 4 · FINAL LOCK'][n];
}
function highlightExpr(str, cls){
  // wraps decimal places (after '.') in highlight span
  const dot = str.indexOf('.');
  if(dot<0) return `<span class="num">${str}</span>`;
  const head = str.slice(0,dot+1), tail = str.slice(dot+1);
  return `<span class="num">${head}<span class="hi ${cls}">${tail}</span></span>`;
}
function highlightSig(str, cls){
  // wraps significant digits in highlight span (simple: highlight all non-leading-zero digits)
  let chars = str.split('');
  let seenNonZero=false; let out='';
  for(let i=0;i<chars.length;i++){
    const c = chars[i];
    if(c==='.'){ out+=c; continue; }
    if(c!=='0') seenNonZero=true;
    if(seenNonZero){ out += `<span class="hi ${cls}">${c}</span>`; } else { out += c; }
  }
  return `<span class="num">${out}</span>`;
}

function renderSlide(){
  const s = deck[curIndex];
  const el = document.getElementById('slide-container');
  document.getElementById('stage-pill').textContent = stageLabel(s.stage);
  document.getElementById('progress-fill').style.width = ((curIndex+1)/deck.length*100)+'%';
  el.innerHTML = renderKind(s);
  postRenderBind(s);
  updateDockState(s);
}

function renderKind(s){
  const d = s.data;
  switch(s.kind){
    case 'mcq': return `
      <div class="card">
        <div class="eyebrow">${d.eyebrow}</div>
        <h2 class="title">${d.title.replace(/\n/g,'<br>')}</h2>
        <div class="opts" id="mcq-opts">
          ${d.opts.map((o,i)=>`<div class="opt ${s.step>=1 && i===d.correctIdx?'correct':''}" data-i="${i}"><span class="k">${['A','B','C','D'][i]}</span>${o}</div>`).join('')}
        </div>
        <div class="explain-box ${s.step>=1?'show':''}">${s.step>=1?('<b>✓ الإجابة</b> — '+d.explain):''}</div>
      </div>`;
    case 'numpad': return `
      <div class="card">
        <div class="eyebrow">${d.eyebrow}</div>
        <div class="numbers-block"><span class="expr">${d.v}</span>${d.u?`<span style="font-family:var(--font-num); color:var(--text-dim); margin-right:8px;">${d.u}</span>`:''}</div>
        <p class="lead" style="text-align:center;">كم رقمًا معنويًا في هذا القياس؟</p>
        <div class="numpad">${[1,2,3,4,5].map(n=>`<div class="n ${s.step>=1 && n===d.n?'correct':''}">${n}</div>`).join('')}</div>
        <div class="explain-box ${s.step>=1?'show':''}">${s.step>=1?('<b>✓ الإجابة: '+d.n+'</b> — '+d.explain):''}</div>
      </div>`;
    case 'match': return `
      <div class="card">
        <div class="eyebrow">${d.eyebrow}</div>
        <h2 class="title">العدد <b style="color:var(--bad); font-family:var(--font-num);">${d.base}</b> غامض من حيث عدد أرقامه المعنوية — طابق كل صيغة علمية مع عدد أرقامها المعنوية.</h2>
        <div class="match-wrap">
          <div class="match-col" id="match-left"><h4>الصيغة العلمية</h4>${d.left.map(c=>`<div class="match-card" data-id="${c.id}">${c.label}</div>`).join('')}</div>
          <div class="match-col" id="match-right"><h4>عدد الأرقام المعنوية</h4>${d.right.map(c=>`<div class="match-card label" data-id="${c.id}" data-match="${c.match}">${c.label}</div>`).join('')}</div>
        </div>
        <div class="explain-box ${s.matched>=d.left.length?'show':''}">${s.matched>=d.left.length?('<b>✓ تم فك الغموض</b> — '+d.explain):''}</div>
      </div>`;
    case 'demo': {
      const c = d.calc; const isAdd = d.ruleType==='addsub';
      return `
      <div class="card">
        <div class="eyebrow">${d.eyebrow}</div>
        <h2 class="title">${d.title}</h2>
        <div class="numbers-block"><span class="expr">${d.aStr}${d.suffix} <span class="op">${d.op}</span> ${d.bStr}${d.suffix}</span></div>
        <div class="explain-box ${s.step>=1?'show':''}">
          ${s.step>=1? `<b>القاعدة:</b> ${isAdd?RULE_ADDSUB.tag:RULE_MULDIV.tag}<br>
          <b>الآلة الحاسبة:</b> ${c.rawDisplay}${d.suffix}<br>
          <b>✓ الناتج الفيزيائي:</b> ${c.answer}${d.suffix}` : ''}
        </div>
      </div>`;
    }
    case 'steps': {
      const c = d.calc; const isAdd = d.ruleType==='addsub'; const clsRule = isAdd?'':'mul';
      const exprHead = isAdd
        ? `${d.aStr}${d.suffix} <span class="op">${d.op}</span> ${d.bStr}${d.suffix}`
        : `${d.aStr} <span class="op">${d.op}</span> ${d.bStr}`;
      const analyzedExpr = s.analyzeOn
        ? (isAdd ? `${highlightExpr(d.aStr,'')} <span class="op">${d.op}</span> ${highlightExpr(d.bStr,'')}` : `${highlightSig(d.aStr,'mul')} <span class="op">${d.op}</span> ${highlightSig(d.bStr,'mul')}`)
        : exprHead;
      return `
      <div class="card">
        <div class="eyebrow">${d.eyebrow}</div>
        <div class="numbers-block"><span class="expr">${analyzedExpr}</span>
          <div class="sub">${isAdd? `منازل عشرية: ${d.aStr}=${c.dpA} · ${d.bStr}=${c.dpB}` : `أرقام معنوية: ${d.aStr}=${c.sigA} · ${d.bStr}=${c.sigB}`}</div>
        </div>
        ${d.gateFirst && !s.gateResolved ? `
          <p class="lead" style="text-align:center;">توقّف. حدّد القاعدة أولًا:</p>
          <div class="gate-row" id="gate-row">
            <div class="gate-btn" data-v="addsub">جمع / طرح</div>
            <div class="gate-btn" data-v="muldiv">ضرب / قسمة</div>
          </div>` : `
        <button class="analyze-btn ${s.analyzeOn?'on':''}" id="analyze-toggle">🔍 ANALYZE</button>
        <div class="steps-ladder">
          <div class="step-row ${clsRule} ${s.step>=1?'active':''}">
            <div class="stitle">STEP 1 — ما القاعدة؟</div>
            <div class="sval">${s.step>=1? (isAdd?RULE_ADDSUB.tag:RULE_MULDIV.tag) : '—'}</div>
          </div>
          <div class="step-row ${clsRule} ${s.step>=2?'active':''}">
            <div class="stitle">STEP 2 — احسب على الآلة الحاسبة</div>
            <div class="sval">${s.step>=2? c.rawDisplay+d.suffix : '—'}</div>
          </div>
          <div class="step-row ${clsRule} ${s.step>=3?'active':''}">
            <div class="stitle">STEP 3 — قرّب حسب القاعدة</div>
            <div class="sval">${s.step>=3? ('<b style="color:var(--good)">'+c.answer+d.suffix+'</b> — ' + (isAdd? `أقل عدد منازل عشرية = ${c.minDp}` : `أقل عدد أرقام معنوية = ${c.minSig}`)) : '—'}</div>
          </div>
        </div>`}
      </div>`;
    }
    case 'decidedp': {
      return `
      <div class="card">
        <div class="eyebrow">اكتشف القاعدة</div>
        <h2 class="title">أي عدد يحدد دقة الإجابة؟</h2>
        <div class="stack-nums">
          <div class="row">${d.aStr}</div>
          <div class="op-row">${d.op}</div>
          <div class="row">${d.bStr}</div>
          <div class="line"></div>
        </div>
        <p class="lead" style="text-align:center; margin-top:14px;">إلى أي منزلة عشرية يجب أن نقرّب الناتج؟</p>
        <div class="opts" id="dp-opts">
          ${d.options.map(v=>`<div class="opt" data-v="${v}" style="text-align:center;">${v}</div>`).join('')}
        </div>
        <div class="explain-box ${s.step>=1?'show':''}">${s.step>=1? `<b>✓ الإجابة: ${d.correctValue}</b> — ${d.explain}<br><br>${parseFloat(d.aStr)+parseFloat(d.bStr)} ← ${(parseFloat(d.aStr)+parseFloat(d.bStr)).toFixed(d.correctValue)}` : ''}</div>
      </div>`;
    }
    case 'rulecard': {
      const r = d.rule;
      return `<div class="card rule-card ${r.cls}">
        <div class="tag">${r.tag}</div>
        <div class="body">${r.body}</div>
        <div class="hook">${r.hook}</div>
      </div>`;
    }
    case 'comparison': {
      return `<div class="card">
        <h2 class="title" style="text-align:center;">${d.title}</h2>
        <div class="compare-grid">
          <div class="compare-box blue"><div class="h">🟦 الفاصلة تحكم</div><div class="op">الجمع والطرح</div><div class="rule">نقرّب حسب أقل عدد من المنازل العشرية بين المعطيات.</div></div>
          <div class="compare-box orange"><div class="h">🟧 الأرقام تحكم</div><div class="op">الضرب والقسمة</div><div class="rule">نقرّب حسب أقل عدد من الأرقام المعنوية بين المعطيات.</div></div>
        </div>
      </div>`;
    }
    case 'info': {
      return `<div class="card">
        <div class="eyebrow">${d.eyebrow}</div>
        <h2 class="title" style="text-align:center;">${d.title}</h2>
        <p class="lead" style="text-align:center; white-space:pre-line;">${d.body}</p>
      </div>`;
    }
    case 'trap': {
      return `<div class="card">
        <div class="trap-badge">⚠ CALCULATOR TRAP</div>
        <p class="lead">${d.context}</p>
        <div class="numbers-block"><span class="expr">${d.calc}</span></div>
        <p class="lead" style="text-align:center;">من يقرر شكل الإجابة النهائية؟</p>
        <div class="opts single">
          ${d.opts.map((o,i)=>`<div class="opt ${s.step>=1 && i===d.correct?'correct':''}"><span class="k">${['A','B','C','D'][i]}</span>${o}</div>`).join('')}
        </div>
        <div class="explain-box ${s.step>=1?'show':''}">${s.step>=1?('<b>✓ الإجابة B</b> — '+d.explain):''}</div>
      </div>`;
    }
    case 'challenge': {
      const c = d.calc; const isAdd = d.ruleType==='addsub';
      return `<div class="card">
        <div class="eyebrow">${d.eyebrow}</div>
        <h2 class="title">${d.title}</h2>
        ${d.withConfidence? `
        <p class="lead" style="text-align:center;">كم نسبة ثقتك في إجابتك؟</p>
        <div class="conf-row" id="conf-row">${[25,50,75,100].map(v=>`<div class="conf-btn ${s.confidence===v?'chosen':''}" data-v="${v}">${v}%</div>`).join('')}</div>
        ` : ''}
        <div class="explain-box ${s.step>=1?'show':''}">${s.step>=1? `<b>✓ الناتج:</b> ${c.answer}${d.suffix}<br>${d.note}${d.withConfidence && s.confidence!=null ? `<br><br>هل كانت ثقتك (${s.confidence}%) في مكانها؟` : ''}` : ''}</div>
      </div>`;
    }
    case 'boss': {
      return `<div class="card">
        <div class="eyebrow">FINAL BOSS</div>
        <h2 class="title">(12.35 + 2.1) × 3.2</h2>
        <p class="lead">لا نكشف الحل دفعة واحدة — لنحدد كل خطوة معًا.</p>
        ${d.sub.map((q,i)=>`
          <div class="boss-q ${s.step>i?'active':''}">
            <div class="qn">${i+1}. ${q.q}</div>
            <div class="qa ${s.step>i?'show':''}">${q.a}</div>
          </div>`).join('')}
      </div>`;
    }
    case 'finallock': {
      return `<div class="card">
        <h2 class="title" style="text-align:center;">التثبيت النهائي</h2>
        <div class="compare-grid">
          <div class="compare-box blue"><div class="h">🟦 جمع وطرح</div><div class="op">الفاصلة تحكم</div><div class="rule">أقل منازل عشرية → هو الذي يحدد التقريب.</div></div>
          <div class="compare-box orange"><div class="h">🟧 ضرب وقسمة</div><div class="op">الأرقام تحكم</div><div class="rule">أقل أرقام معنوية → هو الذي يحدد التقريب.</div></div>
        </div>
        <div class="mini-examples">
          <span>1.367 + 13.2 → <b>14.6</b></span>
          <span>4.6 × 13.2 → <b>61</b></span>
        </div>
        <div class="rhet">
          <span class="no">"لا تسأل: ماذا أعطتني الآلة الحاسبة؟"</span><br>
          <span class="yes">"اسأل: ما دقة القياسات التي بدأت بها؟"</span>
        </div>
        <button class="lock-btn" id="lock-btn">🔒 تثبيت الفكرة</button>
        <div class="lock-confirm" id="lock-confirm">تم تثبيت قواعد الأرقام المعنوية.</div>
      </div>`;
    }
  }
  return '';
}

function postRenderBind(s){
  const d = s.data;
  if(s.kind==='match'){
    document.querySelectorAll('#match-left .match-card').forEach(c=>c.addEventListener('click', ()=>{
      if(c.classList.contains('locked')) return;
      document.querySelectorAll('#match-left .match-card').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected'); s.selectedLeft = c.dataset.id;
    }));
    document.querySelectorAll('#match-right .match-card').forEach(c=>c.addEventListener('click', ()=>{
      if(c.classList.contains('locked') || !s.selectedLeft) return;
      const leftCard = document.querySelector(`#match-left .match-card[data-id="${s.selectedLeft}"]`);
      if(s.selectedLeft === c.dataset.match){
        leftCard.classList.remove('selected'); leftCard.classList.add('locked'); c.classList.add('locked');
        s.matched++; s.selectedLeft=null;
        if(s.matched>=d.left.length){ s.step=1; renderSlide(); }
      } else {
        c.classList.add('shake'); leftCard.classList.add('shake');
        setTimeout(()=>{c.classList.remove('shake'); leftCard.classList.remove('shake');},300);
        s.selectedLeft=null;
      }
    }));
  }
  if(s.kind==='steps' && d.gateFirst && !s.gateResolved){
    document.querySelectorAll('#gate-row .gate-btn').forEach(b=>b.addEventListener('click', ()=>{
      const correct = (d.ruleType==='addsub' && b.dataset.v==='addsub') || (d.ruleType==='muldiv' && b.dataset.v==='muldiv');
      if(correct){ b.classList.add('chosen-correct'); s.gateResolved=true; setTimeout(()=>renderSlide(),350); }
      else { b.classList.add('chosen-wrong'); setTimeout(()=>b.classList.remove('chosen-wrong'),500); }
    }));
  }
  if(s.kind==='steps' && (!d.gateFirst || s.gateResolved)){
    const at = document.getElementById('analyze-toggle');
    if(at) at.addEventListener('click', ()=>{ s.analyzeOn = !s.analyzeOn; renderSlide(); });
  }
  if(s.kind==='challenge' && d.withConfidence){
    document.querySelectorAll('#conf-row .conf-btn').forEach(b=>b.addEventListener('click', ()=>{
      s.confidence = parseInt(b.dataset.v); renderSlide();
    }));
  }
  if(s.kind==='finallock'){
    const lb = document.getElementById('lock-btn');
    if(lb) lb.addEventListener('click', ()=>{ document.getElementById('lock-confirm').classList.add('show'); lb.disabled=true; });
  }
}

/* =========================================================
   DOCK CONTROLS / STATE MACHINE
========================================================= */
function updateDockState(s){
  const nextBtn = document.getElementById('btn-next');
  const revealBtn = document.getElementById('btn-reveal');
  const ruleBtn = document.getElementById('btn-rule');
  const explainBtn = document.getElementById('btn-explain');
  const hasRule = ['demo','steps','challenge'].includes(s.kind) || (s.kind==='decidedp');
  const hasExplain = ['mcq','numpad','match','demo','steps','trap','challenge','decidedp'].includes(s.kind);
  ruleBtn.disabled = !hasRule;
  explainBtn.disabled = !hasExplain;
  const atEnd = (curIndex === deck.length-1) && (s.step>=s.maxStep);
  nextBtn.textContent = atEnd ? 'انتهت الحصة' : 'التالي';
  nextBtn.disabled = atEnd;
  revealBtn.disabled = (s.step>=s.maxStep) || (s.kind==='rulecard'||s.kind==='comparison'||s.kind==='info'||s.kind==='finallock'||s.kind==='boss'&&false);
  if(s.kind==='rulecard'||s.kind==='comparison'||s.kind==='info'||s.kind==='finallock') revealBtn.disabled = true;
}
function doNext(){
  const s = deck[curIndex];
  if(s.kind==='steps' && s.data.gateFirst && !s.gateResolved && s.step===0){ flash('اختر القاعدة أولًا'); return; }
  if(s.kind==='match' && s.matched < s.data.left.length){ flash('أكمل المطابقة أولًا'); return; }
  if(s.step < s.maxStep){ s.step++; renderSlide(); return; }
  if(curIndex < deck.length-1){ curIndex++; renderSlide(); }
}
function doReveal(){
  const s = deck[curIndex];
  if(s.kind==='match'){
    document.querySelectorAll('#match-left .match-card, #match-right .match-card').forEach(c=>c.classList.add('locked'));
    s.matched = s.data.left.length; s.step=1; renderSlide(); return;
  }
  if(s.kind==='steps' && s.data.gateFirst && !s.gateResolved){ s.gateResolved = true; }
  s.step = s.maxStep; renderSlide();
}
function showRuleOverlay(){
  const s = deck[curIndex];
  let rt = s.data.ruleType;
  if(!rt) return;
  const r = rt==='addsub'? RULE_ADDSUB : RULE_MULDIV;
  document.getElementById('overlay-body').innerHTML = `
    <div class="rule-card ${r.cls}" style="border:none; padding:6px;">
      <div class="tag">${r.tag}</div>
      <div class="body">${r.body}</div>
      <div class="hook">${r.hook}</div>
    </div>
    <button class="dbtn next overlay-close" onclick="closeOverlay()">إغلاق</button>`;
  document.getElementById('overlay').classList.add('show');
}
function showExplainOverlay(){
  const s = deck[curIndex];
  let txt = s.data.explain || s.data.note || (s.kind==='decidedp'? s.data.explain : null);
  if(!txt){ flash('لا يوجد شرح إضافي لهذا السؤال'); return; }
  document.getElementById('overlay-body').innerHTML = `
    <div class="eyebrow">الشرح</div>
    <p class="lead" style="color:var(--text);">${txt}</p>
    <button class="dbtn next overlay-close" onclick="closeOverlay()">إغلاق</button>`;
  document.getElementById('overlay').classList.add('show');
}

/* =========================================================
   TIMER
========================================================= */
let timerOn=false, timerRunning=false, timerSec=600, timerHandle=null;
function toggleTimer(){
  const el = document.getElementById('clock');
  if(!timerOn){ timerOn=true; el.classList.add('on'); startTimer(); return; }
  if(timerRunning){ pauseTimer(); } else { startTimer(); }
}
function startTimer(){
  timerRunning=true;
  timerHandle = setInterval(()=>{
    timerSec = Math.max(0,timerSec-1);
    const m = Math.floor(timerSec/60), sec = timerSec%60;
    document.getElementById('clock').textContent = String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
    if(timerSec<=0) pauseTimer();
  },1000);
}
function pauseTimer(){ timerRunning=false; clearInterval(timerHandle); }

/* =========================================================
   TEAM MODE
========================================================= */
let teamModeOn=false; let teams={a:0,b:0};
function toggleTeamMode(){
  teamModeOn = !teamModeOn;
  document.getElementById('scoreboard-bar').classList.toggle('on', teamModeOn);
  document.getElementById('score-mini').classList.toggle('on', teamModeOn);
}
function adjTeam(t, delta){
  teams[t] = Math.max(0, teams[t]+delta);
  document.getElementById('team-'+t+'-score').textContent = teams[t];
  document.getElementById('mini-'+t).textContent = teams[t];
}

/* =========================================================
   BOOT
========================================================= */
function beginDeck(){
  buildDeck();
  curIndex = 0;
  document.getElementById('start-wrap').style.display='none';
  document.getElementById('slide-container').style.display='block';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('dock').style.display='block';
  renderSlide();
}
function resetDeck(){
  pauseTimer(); timerOn=false; timerSec=600;
  document.getElementById('clock').textContent='10:00';
  document.getElementById('clock').classList.remove('on');
  buildDeck();
  curIndex = 0;
  renderSlide();
  flash('تمت إعادة الضبط');
}
</script>
