<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مختبر الاكتشاف — التعريف بالفيزياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0c1424;
    --bg-panel:#141f36;
    --bg-panel-2:#1b2a47;
    --amber:#ffb454;
    --amber-dim:#7a5a2c;
    --cyan:#5eead4;
    --coral:#ff6b6b;
    --text:#eef2f8;
    --muted:#93a1b8;
    --line:#28395c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, #1c2c50 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #17233f 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .stage{
    width:100%;
    max-width:640px;
    position:relative;
  }
  .tape{
    position:relative;
    height:34px;
    border-radius:8px;
    background: repeating-linear-gradient(
      90deg,
      var(--bg-panel-2) 0px, var(--bg-panel-2) 9px,
      #223255 9px, #223255 10px
    );
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:22px;
  }
  .tape-fill{
    position:absolute; inset:0;
    width:0%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }
  .tape-ticks{
    position:absolute; inset:0;
    display:flex; align-items:flex-end;
    pointer-events:none;
  }
  .tape-ticks span{
    flex:1; border-left:1px solid rgba(255,255,255,.10); height:100%;
  }
  .tape-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:13px; letter-spacing:.5px;
    color:var(--bg-deep);
    mix-blend-mode:screen;
  }
  .tape-caret{
    position:absolute; top:-9px;
    width:0; height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:9px solid var(--amber);
    transform:translateX(50%);
    transition:right .5s cubic-bezier(.4,0,.2,1);
    filter:drop-shadow(0 0 6px rgba(255,180,84,.7));
  }

  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--line);
    border-radius:20px;
    padding:30px 26px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
    min-height:380px;
    display:flex;
    flex-direction:column;
  }

  /* ---- Intro screen ---- */
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px;
    color:var(--amber); background:rgba(255,180,84,.1);
    border:1px solid rgba(255,180,84,.3); border-radius:999px;
    padding:6px 14px; width:fit-content; margin-bottom:18px;
  }
  h1{
    font-family:'Tajawal',sans-serif; font-weight:900;
    font-size:clamp(26px,6vw,36px); line-height:1.25; margin:0 0 12px;
  }
  h1 em{
    font-style:normal; color:var(--amber);
  }
  .lede{ color:var(--muted); font-size:15.5px; line-height:1.9; margin:0 0 26px; }
  .dial-row{ display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap; }
  .dial{
    flex:1; min-width:110px;
    background:rgba(94,234,212,.06);
    border:1px solid var(--line);
    border-radius:14px; padding:14px 12px; text-align:center;
  }
  .dial b{ display:block; font-family:'Tajawal',sans-serif; font-size:22px; color:var(--cyan); }
  .dial span{ display:block; font-size:12px; color:var(--muted); margin-top:4px; }

  .btn{
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:16px;
    border:none; border-radius:12px; padding:15px 20px; cursor:pointer;
    background:linear-gradient(180deg,#ffc57a,var(--amber));
    color:#241505; box-shadow:0 10px 24px -8px rgba(255,180,84,.55);
    transition:transform .15s ease, box-shadow .15s ease;
    width:100%;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 14px 28px -8px rgba(255,180,84,.7); }
  .btn:active{ transform:translateY(0); }
  .btn.ghost{
    background:transparent; color:var(--text);
    border:1px solid var(--line); box-shadow:none; margin-top:10px;
  }
  .btn.ghost:hover{ border-color:var(--amber); color:var(--amber); }

  /* ---- Question screen ---- */
  .qmeta{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Tajawal',sans-serif; font-size:13px; color:var(--muted); margin-bottom:14px;
  }
  .qmeta .score{ color:var(--cyan); font-weight:700; }
  .qtext{
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:19px;
    line-height:1.6; margin-bottom:20px;
  }
  .opts{ display:flex; flex-direction:column; gap:10px; flex:1; }
  .opt{
    text-align:right; background:rgba(255,255,255,.03);
    border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:14px 16px; font-family:'Cairo',sans-serif;
    font-size:15px; cursor:pointer; transition:.15s ease;
  }
  .opt:hover{ border-color:var(--cyan); background:rgba(94,234,212,.06); }
  .opt.correct{ border-color:var(--cyan); background:rgba(94,234,212,.15); color:#c8fff2; }
  .opt.wrong{ border-color:var(--coral); background:rgba(255,107,107,.15); color:#ffd3d3; }
  .opt.disabled{ pointer-events:none; opacity:.75; }
  .feedback{
    margin-top:16px; font-size:13.5px; color:var(--muted);
    background:rgba(255,255,255,.04); border-radius:10px; padding:12px 14px;
    display:none; line-height:1.8;
  }
  .feedback.show{ display:block; }
  .nextwrap{ margin-top:18px; }

  /* ---- Matching round ---- */
  .match-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; flex:1; }
  .match-col h3{
    font-family:'Tajawal',sans-serif; font-size:13px; color:var(--muted);
    margin:0 0 10px; font-weight:700;
  }
  .tile{
    background:rgba(255,255,255,.03); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; margin-bottom:8px;
    font-size:14.5px; cursor:pointer; transition:.15s ease; text-align:center;
  }
  .tile:hover{ border-color:var(--amber); }
  .tile.selected{ border-color:var(--amber); background:rgba(255,180,84,.14); }
  .tile.matched{ border-color:var(--cyan); background:rgba(94,234,212,.12); opacity:.6; pointer-events:none; }
  .tile.shake{ border-color:var(--coral); animation:shake .3s; }
  @keyframes shake{ 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

  /* ---- Results ---- */
  .result-emoji{ font-size:56px; text-align:center; margin-bottom:8px; }
  .result-score{
    font-family:'Tajawal',sans-serif; font-weight:900; font-size:42px;
    text-align:center; color:var(--amber); margin:0;
  }
  .result-line{ text-align:center; color:var(--muted); margin:6px 0 24px; font-size:14.5px; }
  .stars{ text-align:center; font-size:26px; letter-spacing:6px; margin-bottom:22px; }

  footer{
    text-align:center; color:var(--muted); font-size:12px; margin-top:16px;
    font-family:'Cairo',sans-serif;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="tape">
    <div class="tape-fill" id="tapeFill"></div>
    <div class="tape-ticks" id="tapeTicks"></div>
    <div class="tape-label" id="tapeLabel">0 / 12</div>
    <div class="tape-caret" id="tapeCaret" style="right:0%"></div>
  </div>

  <div class="card" id="card"></div>
  <footer>مغامرة اكتشاف الفيزياء · درس التعريف بالفيزياء والقياس · الصف التاسع</footer>
</div>

<script>
const QUESTIONS = [
  {
    type:'mcq',
    q:'الفيزياء هي العلم الذي يهتم بشكل أساسي بـ:',
    opts:['حفظ أسماء الكائنات الحية','معرفة الطبيعة وتفسير ظواهرها من الجسيمات الدقيقة حتى الأجسام الضخمة','دراسة تاريخ الأحداث القديمة','تصنيف المركّبات الكيميائية فقط'],
    correct:1,
    explain:'الفيزياء علم طبيعي يدرس أنظمة الطبيعة بدءًا من الذرة الصغيرة جدًا وصولًا إلى الأجسام الكبيرة جدًا كالمجرات.'
  },
  {
    type:'tf',
    q:'صواب أم خطأ: تتكامل الفيزياء مع علوم أخرى مثل الكيمياء والأحياء والرياضيات والهندسة والطب.',
    opts:['صواب','خطأ'],
    correct:0,
    explain:'نعم، الفيزياء علم أساسي تتقاطع مبادئه مع كثير من المجالات العلمية والتطبيقية الأخرى.'
  },
  {
    type:'mcq',
    q:'أي مما يلي مثال على تطبيق عملي لفروع الفيزياء المختلفة في السيارة؟',
    opts:['المحرك يعتمد على الديناميكا الحرارية والمرايا تعتمد على البصريات','المحرك يعتمد على علم الأحياء','المصابيح لا علاقة لها بأي فرع من فروع الفيزياء','المرآة تعتمد على الكيمياء العضوية'],
    correct:0,
    explain:'أجزاء السيارة الواحدة قد تعتمد على أكثر من فرع فيزيائي: المحرك (ديناميكا حرارية)، البطارية والمصابيح (كهرومغناطيسية)، المرايا (بصريات).'
  },
  {
    type:'mcq',
    q:'الكمّية الفيزيائية مثل الطول أو الكتلة تُعبَّر عنها عادة بـ:',
    opts:['قيمة عددية فقط دون وحدة','وصف لغوي فقط','قيمة عددية مرتبطة بوحدة قياس','رسم بياني فقط'],
    correct:2,
    explain:'أي كمية فيزيائية تحتاج قيمة عددية + وحدة قياس معًا، مثل 12 m أو 3 kg.'
  },
  {
    type:'tf',
    q:'صواب أم خطأ: النظام الدولي للوحدات (SI) يهدف إلى توحيد وحدات القياس لتسهيل تبادل المعلومات العلمية بين دول العالم.',
    opts:['صواب','خطأ'],
    correct:0,
    explain:'صحيح، اعتُمد النظام الدولي (SI) عام 1960 لتوحيد وحدات القياس عالميًا.'
  },
  {
    type:'mcq',
    q:'ما الفرق بين الوحدات الأساسية والوحدات المشتقة؟',
    opts:['لا يوجد فرق بينهما','الأساسية مثل المتر والكيلوغرام، والمشتقة تُعبَّر بدلالة الأساسية مثل النيوتن والجول','المشتقة أقدم من الأساسية','الأساسية تُستخدم في الكيمياء فقط'],
    correct:1,
    explain:'الوحدات الأساسية سبع وحدات مستقلة (كالمتر m والكيلوغرام kg والثانية s)، أما الوحدات المشتقة فتُحسب من دمجها، مثل النيوتن N = kg·m·s⁻².'
  },
  {
    type:'mcq',
    q:'عالم الفلك يدرس بشكل أساسي:',
    opts:['المركبات الكيميائية العضوية','النجوم والمجرات والأجسام الكونية الضخمة','الخلايا الحية داخل جسم الإنسان','قواعد اللغة العربية'],
    correct:1,
    explain:'الفيزياء الفلكية أحد فروع الفيزياء، وتُعنى بدراسة الأجرام السماوية كالنجوم والمجرات.'
  }
];

const MATCH_PAIRS = [
  {q:'الطول', a:'متر (m)'},
  {q:'الكتلة', a:'كيلوغرام (kg)'},
  {q:'الزمن', a:'ثانية (s)'},
  {q:'درجة الحرارة', a:'كلفن (K)'},
  {q:'التيار الكهربائي', a:'أمبير (A)'}
];

let idx = 0;
let score = 0;
const totalSteps = QUESTIONS.length + 1; // +1 for the matching round block
const card = document.getElementById('card');
const tapeFill = document.getElementById('tapeFill');
const tapeCaret = document.getElementById('tapeCaret');
const tapeLabel = document.getElementById('tapeLabel');
const tapeTicks = document.getElementById('tapeTicks');
for(let i=0;i<24;i++){ const s=document.createElement('span'); tapeTicks.appendChild(s); }

function updateTape(step){
  const pct = Math.round((step/totalSteps)*100);
  tapeFill.style.width = pct+'%';
  tapeCaret.style.right = pct+'%';
  tapeLabel.textContent = step+' / '+totalSteps;
}

function shuffle(arr){
  return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
}

function renderIntro(){
  updateTape(0);
  card.innerHTML = `
    <span class="eyebrow">⚡ مختبر الاكتشاف</span>
    <h1>هل أنت جاهز <em>لاكتشاف الفيزياء؟</em></h1>
    <p class="lede">تحدٍّ سريع وتفاعلي مبني على درس "التعريف بالفيزياء": تعريف العلم، فروعه، علاقته بالعلوم الأخرى، والنظام الدولي للوحدات.</p>
    <div class="dial-row">
      <div class="dial"><b>${QUESTIONS.length}</b><span>أسئلة متنوعة</span></div>
      <div class="dial"><b>5</b><span>أزواج قياس ووحدات</span></div>
      <div class="dial"><b>~5</b><span>دقائق</span></div>
    </div>
    <button class="btn" id="startBtn">ابدأ التحدي 🚀</button>
  `;
  document.getElementById('startBtn').onclick = ()=>{ idx=0; score=0; renderQuestion(); };
}

function renderQuestion(){
  updateTape(idx);
  const q = QUESTIONS[idx];
  const optsHtml = q.opts.map((o,i)=>`<div class="opt" data-i="${i}">${o}</div>`).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span>سؤال ${idx+1} من ${QUESTIONS.length}</span>
      <span class="score">النقاط: ${score}</span>
    </div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${optsHtml}</div>
    <div class="feedback" id="fb"></div>
    <div class="nextwrap" id="nextWrap"></div>
  `;
  document.querySelectorAll('.opt').forEach(el=>{
    el.onclick = ()=>{
      const chosen = parseInt(el.dataset.i);
      document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
      if(chosen === q.correct){
        el.classList.add('correct');
        score += 10;
      } else {
        el.classList.add('wrong');
        document.querySelector(`.opt[data-i="${q.correct}"]`).classList.add('correct');
      }
      const fb = document.getElementById('fb');
      fb.textContent = q.explain;
      fb.classList.add('show');
      document.querySelector('.score').textContent = 'النقاط: '+score;
      document.getElementById('nextWrap').innerHTML = `<button class="btn" id="nextBtn">${idx+1<QUESTIONS.length ? 'السؤال التالي ←' : 'انتقل لجولة المطابقة ←'}</button>`;
      document.getElementById('nextBtn').onclick = ()=>{
        idx++;
        if(idx < QUESTIONS.length){ renderQuestion(); } else { renderMatching(); }
      };
    };
  });
}

function renderMatching(){
  updateTape(QUESTIONS.length);
  const qtiles = shuffle(MATCH_PAIRS.map((p,i)=>({label:p.q, id:i})));
  const atiles = shuffle(MATCH_PAIRS.map((p,i)=>({label:p.a, id:i})));
  card.innerHTML = `
    <div class="qmeta">
      <span>الجولة الأخيرة: طابق كل كمّية فيزيائية بوحدتها في النظام الدولي</span>
      <span class="score">النقاط: ${score}</span>
    </div>
    <div class="match-grid">
      <div class="match-col"><h3>الكمّية الفيزيائية</h3><div id="colQ"></div></div>
      <div class="match-col"><h3>وحدة القياس (SI)</h3><div id="colA"></div></div>
    </div>
    <div class="feedback" id="matchFb"></div>
    <div class="nextwrap" id="matchNext"></div>
  `;
  const colQ = document.getElementById('colQ');
  const colA = document.getElementById('colA');
  qtiles.forEach(t=>{
    const d = document.createElement('div');
    d.className='tile'; d.textContent=t.label; d.dataset.id=t.id; d.dataset.side='q';
    colQ.appendChild(d);
  });
  atiles.forEach(t=>{
    const d = document.createElement('div');
    d.className='tile'; d.textContent=t.label; d.dataset.id=t.id; d.dataset.side='a';
    colA.appendChild(d);
  });

  let selectedQ = null, selectedA = null;
  let matchedCount = 0;

  function checkMatch(){
    if(selectedQ && selectedA){
      if(selectedQ.dataset.id === selectedA.dataset.id){
        selectedQ.classList.add('matched'); selectedA.classList.add('matched');
        selectedQ.classList.remove('selected'); selectedA.classList.remove('selected');
        matchedCount++; score += 8;
        document.querySelector('.score').textContent = 'النقاط: '+score;
        selectedQ = null; selectedA = null;
        if(matchedCount === MATCH_PAIRS.length){
          document.getElementById('matchFb').classList.add('show');
          document.getElementById('matchFb').textContent = 'أحسنت! أنهيت جولة المطابقة بنجاح.';
          document.getElementById('matchNext').innerHTML = `<button class="btn" id="finishBtn">عرض النتيجة النهائية 🏁</button>`;
          document.getElementById('finishBtn').onclick = renderResults;
        }
      } else {
        [selectedQ, selectedA].forEach(el=>{ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),300); });
        setTimeout(()=>{
          selectedQ.classList.remove('selected'); selectedA.classList.remove('selected');
          selectedQ = null; selectedA = null;
        },350);
      }
    }
  }

  card.querySelectorAll('.tile').forEach(t=>{
    t.onclick = ()=>{
      if(t.classList.contains('matched')) return;
      if(t.dataset.side==='q'){
        if(selectedQ) selectedQ.classList.remove('selected');
        selectedQ = t; t.classList.add('selected');
      } else {
        if(selectedA) selectedA.classList.remove('selected');
        selectedA = t; t.classList.add('selected');
      }
      checkMatch();
    };
  });
}

function renderResults(){
  updateTape(totalSteps);
  const maxScore = QUESTIONS.length*10 + MATCH_PAIRS.length*8;
  const pct = score/maxScore;
  let emoji='🔭', line='بداية جيدة! راجع الدرس مرة أخرى وحاول من جديد.', stars='★☆☆';
  if(pct >= 0.85){ emoji='🏆'; line='إتقان رائع! أنت جاهز لبقية وحدة القياس.'; stars='★★★'; }
  else if(pct >= 0.6){ emoji='🔬'; line='أداء جيد جدًا! استمر في المراجعة.'; stars='★★☆'; }

  card.innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <p class="result-score">${score} <span style="font-size:18px;color:var(--muted);">/ ${maxScore}</span></p>
    <p class="result-line">${line}</p>
    <div class="stars">${stars}</div>
    <button class="btn" id="againBtn">إعادة المحاولة 🔁</button>
  `;
  document.getElementById('againBtn').onclick = renderIntro;
}

renderIntro();
</script>
</body>
</html>
