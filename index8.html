function render(){var q=Q[S.i],h='<div class="card src"><div class="tag">السؤال رقم '+q.n+' من الكتاب — صفحة '+PG+' (مراجعة الدرس) — الكتاب هو المرجع</div><div class="qt">'+q.n+' . '+q.t+'</div>'+(q.f?fig(q.f,S.i):'')+'</div>';
q.p.forEach(function(p,b){h+='<div class="card">'+(p.l?'<div class="qt"><b>'+p.l+' .</b> '+p.t+'</div>':'');p.it.forEach(function(x,c){h+=item(S.i,b,c,x)});h+='</div>'});
if(S.i==Q.length-1&&done(S.i))h+='<div class="card" style="text-align:center"><h2>🏁 اكتملت المهمة</h2><p>مجموع نقاطك: '+tot()+' من '+max()+'</p></div>';
$('main').innerHTML=h;$('stage').textContent=q.st;$('meta').textContent='سؤال '+q.n+' من '+Q.length;$('pts').textContent=('000'+tot()).slice(-3);
var c=0,d='';Q.forEach(function(x,i){var f=done(i);c+=f;d+='<b class="'+(f?'on ':'')+(i==S.i?'cur':'')+'"></b>'});$('dots').innerHTML=d;$('pb').style.width=(c/Q.length*100)+'%';
$('pv').disabled=S.i==0;$('nx').disabled=!(S.T||done(S.i))||S.i==Q.length-1;$('tm').className='bt'+(S.T?' p':'')}
function tot(){var s=0;for(var k in pts)s+=pts[k];return s}
function max(){var m=0;Q.forEach(function(q){q.p.forEach(function(p){m+=p.it.length*10})});return m}
function go(d){S.i=Math.max(0,Math.min(Q.length-1,S.i+d));save();render();window.scrollTo(0,0)}
function tg(){S.T=!S.T;render()}
function clr(i){Q[i].p.forEach(function(p,b){p.it.forEach(function(x,c){var k=key(i,b,c);delete ok[k];delete pts[k];delete hu[k];delete tr[k]})})}
function retry(){clr(S.i);save();render()}
function resetAll(){if(confirm('هل تريد البدء من جديد؟')){Q.forEach(function(q,i){clr(i)});S.i=0;save();render()}}
render();
